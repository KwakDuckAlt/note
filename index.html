<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단순 노트패드 (Simple Notepad)</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --sidebar-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
      --active-item: #e9ecef;
      --toolbar-bg: #f1f3f5;
      --editor-bg: #ffffff;
      --button-bg: #e9ecef;
      --button-hover: #ced4da;
      --danger-color: #fa5252;
      --accent-color: #4c6ef5;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --sidebar-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --border-color: #333333;
      --active-item: #2c2c2c;
      --toolbar-bg: #252525;
      --editor-bg: #1e1e1e;
      --button-bg: #2c2c2c;
      --button-hover: #3d3d3d;
      --danger-color: #ff6b6b;
      --accent-color: #748ffc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* 한국어: 맑은 고딕, 영어: Times New Roman 지정 */
      font-family: 'Times New Roman', 'Malgun Gothic', '맑은 고딕', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* 사이드바 (노트 목록) */
    .sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .btn-new-note {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-new-note:hover {
      opacity: 0.9;
    }

    .note-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .note-item {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-item:hover {
      background-color: var(--active-item);
    }

    .note-item.active {
      background-color: var(--active-item);
      border-left: 4px solid var(--accent-color);
    }

    .note-info {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .note-title-preview {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .note-date {
      font-size: 0.75rem;
      opacity: 0.6;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger-color);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      margin-left: 8px;
    }

    /* 메인 에디터 영역 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 툴바 */
    .toolbar {
      background-color: var(--toolbar-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 15px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar button, .toolbar select {
      background-color: var(--button-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
    }

    .toolbar button:hover, .toolbar select:hover {
      background-color: var(--button-hover);
    }

    .toolbar-separator {
      width: 1px;
      height: 20px;
      background-color: var(--border-color);
      margin: 0 4px;
    }

    .theme-toggle {
      margin-left: auto;
    }

    .zoom-level-text {
      font-size: 0.85rem;
      min-width: 45px;
      text-align: center;
      font-weight: bold;
    }

    /* 노티파이어 */
    .save-status {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-right: 5px;
    }

    /* 컬러 피커 스타일링 */
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
    }

    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid var(--border-color);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 2px;
    }

    /* 인증 모달 (로그인/회원가입) */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }

    .auth-card {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 8px;
      width: 340px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .auth-card h3 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.3rem;
    }

    .auth-form-group {
      margin-bottom: 15px;
    }

    .auth-form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    .auth-form-group input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: var(--editor-bg);
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
    }

    .auth-form-group input:focus {
      border-color: var(--accent-color);
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .auth-buttons button {
      flex: 1;
      padding: 9px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .btn-login {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-signup {
      background-color: var(--button-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color) !important;
    }

    .auth-error {
      color: var(--danger-color);
      font-size: 0.8rem;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      background-color: var(--toolbar-bg);
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    /* 편집기 본문 (확대/축소 지원) */
    .editor-wrapper {
      flex: 1;
      overflow: auto;
      background-color: var(--editor-bg);
    }

    .editor-container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 30px;
      background-color: var(--editor-bg);
      transform-origin: top left;
      transition: transform 0.1s ease-out;
    }

    .note-title-input {
      font-size: 1.5rem;
      font-weight: bold;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-color);
      margin-bottom: 15px;
      font-family: inherit;
      width: 100%;
    }

    .editor {
      flex: 1;
      outline: none;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-family: inherit;
      font-size: 16px; /* 기본 글자 크기 */
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 300px;
      tab-size: 4;
    }

    /* 하단 상태바 (글자 수 계산) */
    .statusbar {
      background-color: var(--toolbar-bg);
      border-top: 1px solid var(--border-color);
      padding: 8px 15px;
      font-size: 0.85rem;
      display: flex;
      gap: 20px;
      opacity: 0.9;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- 인증 모달 -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
      <h3 id="auth-title">로그인 / 회원가입</h3>
      <div class="auth-form-group">
        <label for="auth-id">아이디</label>
        <input type="text" id="auth-id" placeholder="아이디 입력" autocomplete="off" spellcheck="false">
      </div>
      <div class="auth-form-group">
        <label for="auth-pw">비밀번호</label>
        <input type="password" id="auth-pw" placeholder="비밀번호 입력">
      </div>
      <div class="auth-error" id="auth-error"></div>
      <div class="auth-buttons">
        <button class="btn-login" id="btn-login-action">로그인</button>
        <button class="btn-signup" id="btn-signup-action">회원가입</button>
      </div>
    </div>
  </div>

  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="user-profile">
      <span>👤 <strong id="logged-user-display">-</strong>님</span>
      <button class="btn-logout" id="btn-logout">로그아웃</button>
    </div>
    <div class="sidebar-header">
      <h2>노트 목록</h2>
      <button class="btn-new-note" id="btn-new">+ 새 노트</button>
    </div>
    <ul class="note-list" id="note-list"></ul>
  </div>

  <!-- 메인 편집 영역 -->
  <div class="main-content">
    <!-- 서식 및 기능 툴바 -->
    <div class="toolbar">
      <!-- 텍스트 서식 -->
      <button onclick="formatDoc('bold')" title="굵게"><b>B</b></button>
      <button onclick="formatDoc('italic')" title="이탈릭"><i>I</i></button>
      <button onclick="formatDoc('underline')" title="밑줄"><u>U</u></button>

      <div class="toolbar-separator"></div>

      <!-- 글자 색상 및 하이라이트 -->
      <div class="color-picker-wrapper" title="글자 색상">
        <span>🎨</span>
        <input type="color" id="input-text-color" value="#ffffff">
      </div>
      <div class="color-picker-wrapper" title="하이라이트(배경) 색상">
        <span>🖍️</span>
        <input type="color" id="input-bg-color" value="#ffff00">
      </div>

      <div class="toolbar-separator"></div>

      <!-- 폰트 크기 조절 -->
      <select id="select-font-size" title="글자 크기 변경">
        <option value="12px">12px</option>
        <option value="14px">14px</option>
        <option value="16px" selected="">16px (기본)</option>
        <option value="18px">18px</option>
        <option value="20px">20px</option>
        <option value="24px">24px</option>
        <option value="28px">28px</option>
        <option value="32px">32px</option>
      </select>

      <div class="toolbar-separator"></div>

      <!-- 화면 확대 / 축소 -->
      <button id="btn-zoom-out" title="화면 축소">🔍 -</button>
      <span class="zoom-level-text" id="zoom-level-display">100%</span>
      <button id="btn-zoom-in" title="화면 확대">🔍 +</button>
      <button id="btn-zoom-reset" title="화면 원래대로">100%</button>

      <div class="toolbar-separator"></div>

      <button id="btn-download" title="텍스트 파일로 내려받기">💾 내려받기 (.txt)</button>
      
      <span class="save-status" id="save-status">자동 저장됨</span>
      
      <button class="theme-toggle" id="btn-theme">☀️ 브라이트 모드</button>
    </div>

    <!-- 에디터 영역 -->
    <div class="editor-wrapper">
      <div class="editor-container" id="editor-container" style="transform: scale(1); width: 100%;">
        <input type="text" class="note-title-input" id="note-title" placeholder="제목 없는 노트" spellcheck="false" autocomplete="off" autocorrect="off" capitalized="off">
        <div class="editor" id="editor" contenteditable="true" spellcheck="false" autocomplete="off" autocorrect="off" capitalized="off" placeholder="내용을 입력하세요..." style="font-size: 20px;"><br></div>
      </div>
    </div>

    <!-- 상태바 (글자 수/단어 수) -->
    <div class="statusbar">
      <span>공백 포함: <strong id="char-count-with-spaces">0</strong>자</span>
      <span>공백 제외: <strong id="char-count-without-spaces">0</strong>자</span>
      <span>단어 수: <strong id="word-count">0</strong>개</span>
    </div>
  </div>

  <script>
    // 계정 및 메모리 상태 관리
    let users = JSON.parse(localStorage.getItem('simple_notepad_users')) || {};
    let currentUser = localStorage.getItem('simple_notepad_current_user') || null;
    let notes = [];
    let currentNoteId = null;
    
    // 기본 모드를 다크 모드로 설정 (설정값이 light인 경우 제외)
    let isDarkMode = localStorage.getItem('simple_notepad_theme') !== 'light';
    let currentZoom = parseFloat(localStorage.getItem('simple_notepad_zoom')) || 1.0;

    // DOM 요소
    const authOverlay = document.getElementById('auth-overlay');
    const authIdInput = document.getElementById('auth-id');
    const authPwInput = document.getElementById('auth-pw');
    const authError = document.getElementById('auth-error');
    const btnLoginAction = document.getElementById('btn-login-action');
    const btnSignupAction = document.getElementById('btn-signup-action');
    const loggedUserDisplay = document.getElementById('logged-user-display');
    const btnLogout = document.getElementById('btn-logout');

    const noteListEl = document.getElementById('note-list');
    const titleInput = document.getElementById('note-title');
    const editorEl = document.getElementById('editor');
    const editorContainer = document.getElementById('editor-container');
    const btnNew = document.getElementById('btn-new');
    const btnDownload = document.getElementById('btn-download');
    const btnTheme = document.getElementById('btn-theme');
    const saveStatusEl = document.getElementById('save-status');
    const selectFontSize = document.getElementById('select-font-size');
    const inputTextColor = document.getElementById('input-text-color');
    const inputBgColor = document.getElementById('input-bg-color');

    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomReset = document.getElementById('btn-zoom-reset');
    const zoomLevelDisplay = document.getElementById('zoom-level-display');

    const charWithSpacesEl = document.getElementById('char-count-with-spaces');
    const charWithoutSpacesEl = document.getElementById('char-count-without-spaces');
    const wordCountEl = document.getElementById('word-count');

    // 초기화
    function init() {
      // 테마 초기 설정 (기본 다크 모드)
      if (isDarkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
        btnTheme.textContent = '☀️ 브라이트 모드';
      } else {
        document.documentElement.removeAttribute('data-theme');
        btnTheme.textContent = '🌙 다크 모드';
      }

      // 화면 배율 초기화
      applyZoom(currentZoom);

      // 로그인 상태 확인
      if (currentUser && users[currentUser]) {
        showAppScreen();
      } else {
        showAuthScreen();
      }
    }

    // 계정 화면 처리
    function showAuthScreen() {
      authOverlay.style.display = 'flex';
      authIdInput.value = '';
      authPwInput.value = '';
      authError.textContent = '';
    }

    function showAppScreen() {
      authOverlay.style.display = 'none';
      loggedUserDisplay.textContent = currentUser;

      // 사용자 노트 데이터 로드
      notes = users[currentUser].notes || [];
      currentNoteId = users[currentUser].currentNoteId || null;

      if (notes.length === 0) {
        createNewNote();
      } else {
        if (!currentNoteId || !notes.find(n => n.id === currentNoteId)) {
          currentNoteId = notes[0].id;
        }
        renderNoteList();
        loadNote(currentNoteId);
      }
      updateStats();
    }

    // 회원가입
    btnSignupAction.addEventListener('click', () => {
      const id = authIdInput.value.trim();
      const pw = authPwInput.value.trim();

      if (!id || !pw) {
        authError.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
        return;
      }

      if (users[id]) {
        authError.textContent = '이미 존재하는 아이디입니다.';
        return;
      }

      users[id] = {
        password: pw,
        notes: [],
        currentNoteId: null
      };

      saveUsersToStorage();
      currentUser = id;
      localStorage.setItem('simple_notepad_current_user', currentUser);
      showAppScreen();
    });

    // 로그인
    btnLoginAction.addEventListener('click', () => {
      const id = authIdInput.value.trim();
      const pw = authPwInput.value.trim();

      if (!id || !pw) {
        authError.textContent = '아이디와 비밀번호를 입력해주세요.';
        return;
      }

      if (!users[id] || users[id].password !== pw) {
        authError.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
        return;
      }

      currentUser = id;
      localStorage.setItem('simple_notepad_current_user', currentUser);
      showAppScreen();
    });

    // 로그아웃
    btnLogout.addEventListener('click', () => {
      saveCurrentNote();
      currentUser = null;
      localStorage.removeItem('simple_notepad_current_user');
      showAuthScreen();
    });

    function saveUsersToStorage() {
      localStorage.setItem('simple_notepad_users', JSON.stringify(users));
    }

    // 텍스트 서식 적용 함수
    function formatDoc(cmd, value = null) {
      document.execCommand(cmd, false, value);
      editorEl.focus();
      triggerAutoSave();
    }

    // 글자 색상 변경
    inputTextColor.addEventListener('input', (e) => {
      formatDoc('foreColor', e.target.value);
    });

    // 하이라이트(배경색) 변경
    inputBgColor.addEventListener('input', (e) => {
      formatDoc('hiliteColor', e.target.value);
    });

    // 새 노트 생성
    function createNewNote() {
      const newNote = {
        id: Date.now().toString(),
        title: '',
        content: '',
        fontSize: '16px',
        updatedAt: new Date().toLocaleString('ko-KR')
      };
      notes.unshift(newNote);
      currentNoteId = newNote.id;
      saveCurrentNote();
      renderNoteList();
      loadNote(currentNoteId);
    }

    // 노트 로드
    function loadNote(id) {
      currentNoteId = id;
      if (currentUser && users[currentUser]) {
        users[currentUser].currentNoteId = currentNoteId;
        saveUsersToStorage();
      }

      const note = notes.find(n => n.id === id);
      if (note) {
        titleInput.value = note.title;
        editorEl.innerHTML = note.content;
        
        const fontSize = note.fontSize || '16px';
        editorEl.style.fontSize = fontSize;
        selectFontSize.value = fontSize;

        updateActiveSidebarItem();
        updateStats();
      }
    }

    // 노트 삭제
    function deleteNote(id, e) {
      e.stopPropagation();
      if (confirm('이 노트를 삭제하시겠습니까?')) {
        notes = notes.filter(n => n.id !== id);
        if (notes.length === 0) {
          createNewNote();
        } else {
          if (currentNoteId === id) {
            currentNoteId = notes[0].id;
          }
          saveCurrentNote();
          renderNoteList();
          loadNote(currentNoteId);
        }
      }
    }

    // 노트 목록 렌더링
    function renderNoteList() {
      noteListEl.innerHTML = '';
      notes.forEach(note => {
        const li = document.createElement('li');
        li.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
        li.onclick = () => loadNote(note.id);

        const titleText = note.title.trim() || '제목 없는 노트';
        
        li.innerHTML = `
          <div class="note-info">
            <div class="note-title-preview">${escapeHtml(titleText)}</div>
            <div class="note-date">${note.updatedAt}</div>
          </div>
          <button class="btn-delete" title="삭제">&times;</button>
        `;

        li.querySelector('.btn-delete').onclick = (e) => deleteNote(note.id, e);
        noteListEl.appendChild(li);
      });
    }

    function updateActiveSidebarItem() {
      document.querySelectorAll('.note-item').forEach(item => {
        item.classList.remove('active');
      });
      renderNoteList();
    }

    // 자동 저장 처리 (디바운스 적용)
    let saveTimeout;
    function triggerAutoSave() {
      saveStatusEl.textContent = '저장 중...';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveCurrentNote();
      }, 300);
    }

    function saveCurrentNote() {
      if (!currentUser || !users[currentUser]) return;

      const note = notes.find(n => n.id === currentNoteId);
      if (note) {
        note.title = titleInput.value;
        note.content = editorEl.innerHTML;
        note.fontSize = editorEl.style.fontSize || '16px';
        note.updatedAt = new Date().toLocaleString('ko-KR');
        
        notes = [note, ...notes.filter(n => n.id !== currentNoteId)];
        
        users[currentUser].notes = notes;
        users[currentUser].currentNoteId = currentNoteId;
        saveUsersToStorage();

        renderNoteList();
        saveStatusEl.textContent = '자동 저장됨';
      }
    }

    // 글자 수 및 단어 수 세기
    function updateStats() {
      const text = editorEl.innerText || '';
      
      const charWithSpaces = text.replace(/\n/g, '').length;
      const charWithoutSpaces = text.replace(/\s/g, '').length;
      
      const trimmedText = text.trim();
      const wordCount = trimmedText === '' ? 0 : trimmedText.split(/\s+/).length;

      charWithSpacesEl.textContent = charWithSpaces.toLocaleString();
      charWithoutSpacesEl.textContent = charWithoutSpaces.toLocaleString();
      wordCountEl.textContent = wordCount.toLocaleString();
    }

    // 파일로 내려받기 (.txt)
    function downloadNote() {
      const title = titleInput.value.trim() || '제목 없는 노트';
      const textContent = editorEl.innerText;

      const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${title}.txt`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    // 1. 글자 크기 변경
    selectFontSize.addEventListener('change', (e) => {
      const size = e.target.value;
      editorEl.style.fontSize = size;
      triggerAutoSave();
    });

    // 2. 화면 확대/축소 기능
    function applyZoom(zoom) {
      currentZoom = Math.min(Math.max(zoom, 0.5), 2.5);
      editorContainer.style.transform = `scale(${currentZoom})`;
      editorContainer.style.width = `${100 / currentZoom}%`;
      zoomLevelDisplay.textContent = `${Math.round(currentZoom * 100)}%`;
      localStorage.setItem('simple_notepad_zoom', currentZoom);
    }

    btnZoomIn.addEventListener('click', () => applyZoom(currentZoom + 0.1));
    btnZoomOut.addEventListener('click', () => applyZoom(currentZoom - 0.1));
    btnZoomReset.addEventListener('click', () => applyZoom(1.0));

    // 3. Tab 키로 큰 여백 삽입 기능
    editorEl.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        document.execCommand('insertText', false, '    ');
        triggerAutoSave();
        updateStats();
      }
    });

    // 이벤트 리스너 등록
    titleInput.addEventListener('input', triggerAutoSave);
    editorEl.addEventListener('input', () => {
      triggerAutoSave();
      updateStats();
    });

    btnNew.addEventListener('click', createNewNote);
    btnDownload.addEventListener('click', downloadNote);

    // 테마 전환 (기본 다크 모드)
    btnTheme.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
        btnTheme.textContent = '☀️ 브라이트 모드';
        localStorage.setItem('simple_notepad_theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
        btnTheme.textContent = '🌙 다크 모드';
        localStorage.setItem('simple_notepad_theme', 'light');
      }
    });

    // 시작 실행
    init();
  </script>

</body></html>
